schema_version: 1
project:
  id: project-slug
  name: Project Name
  type: unknown
repository:
  root: ..
  remote: unknown
  default_branch: unknown
ownership:
  team: unknown
mesh:
  enabled: auto
  failure_policy: continue-local
  path: null
  discovery:
    environment_variable: REPO_MESH_PATH
    sibling_directories:
      - ../repo-mesh
      - ../engineering-mesh
context:
  strategy: adaptive-graph-closure
  hard_token_cap: null
  token_warning_threshold: 32000
  traversal:
    directions:
      - upstream
      - downstream
    include_complete_flows: true
    include_required_edges: true
    include_relevant_edges: true
    include_reference_edges: on-demand
    stop_when: no-new-material-relationships
privacy:
  export:
    source_code: false
    secrets: false
    private_notes: false
    architecture: true
    interfaces: true
    dependencies: true
    decisions: reviewed-only
